name: Construire Atelier de tir

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_PASS: "HKPTpL0ZApxTvvyeG3xnuO1i"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configuration Capacitor
        run: |
          node -e "require('fs').writeFileSync('package.json', JSON.stringify({name:'atelier-de-tir',version:'2.0.0',private:true},null,2))"
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'fr.atelierdetir.app',appName:'Atelier de tir',webDir:'www',android:{backgroundColor:'#0E1417'}},null,2))"

      - name: Installer Capacitor
        run: npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6

      - name: Plateforme Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Icônes
        run: |
          if [ -f resources/icon.png ]; then
            npm install @capacitor/assets@3 --no-save
            npx @capacitor/assets generate --android --iconBackgroundColor "#0E1417" --iconBackgroundColorDark "#0E1417"
          fi

      - name: Numéro de version
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"2.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Compiler
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Signer
        run: |
          set -e
          UNSIGNED=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          BT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools"
          V=$(ls "$BT" | sort -V | tail -n1)
          "$BT/$V/zipalign" -p 4 "$UNSIGNED" aligned.apk
          "$BT/$V/apksigner" sign --ks signature/atelier.keystore --ks-key-alias atelier \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out AtelierDeTir.apk aligned.apk
          "$BT/$V/apksigner" verify AtelierDeTir.apk

      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: atelier-v2.0.${{ github.run_number }}
          name: Atelier de tir 2.0.${{ github.run_number }}
          body: "Télécharge AtelierDeTir.apk sur ton téléphone et installe-le. Les mises à jour s'installent par-dessus sans perdre tes données."
          files: AtelierDeTir.apk
