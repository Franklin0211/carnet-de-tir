<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calculs GRT</title>
<style>
:root{
  --bg:#0E1417; --surf:#151E23; --surf2:#1C272D; --line:#2B3940;
  --brass:#C9972F; --text:#E4E9EB; --mute:#8797A0; --red:#CF5A45; --green:#6FA98B; --amber:#D9A441;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45}
#app{max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:12.5px;margin-top:3px}
button{font:inherit;cursor:pointer}
.btn{border-radius:10px;padding:11px 16px;background:none;border:1px solid var(--line);color:var(--text);font-weight:500}
.btn.p{background:var(--brass);border-color:var(--brass);color:#0E1417;font-weight:600}
.btn.d{border-color:var(--red);color:var(--red)}
.btn.s{padding:7px 12px;font-size:13px}
.btn.full{width:100%}
.btn:focus-visible,tr:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.help{color:var(--mute);font-size:12.5px;margin:8px 2px 0}
.msg{margin-top:12px;padding:10px 12px;border-left:3px solid var(--brass);background:var(--surf);border-radius:0 8px 8px 0;font-size:13.5px;white-space:pre-line}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
.card h2{font-size:15.5px;margin:0 0 4px;font-weight:650}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:12px;color:var(--mute)}
.meta b{color:var(--text);font-weight:500}
.tw{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 5px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600;background:var(--surf2)}
td{font-family:var(--mono);font-size:12px}
th:first-child,td:first-child{text-align:left}
tbody tr{cursor:pointer}
tbody tr:last-child td{border-bottom:0}
tr.sel td{background:rgba(201,151,47,.16)}
tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--brass)}
.pc{display:inline-block;min-width:3.2em}
.ok{color:var(--green)} .mid{color:var(--amber)} .hot{color:var(--red)}
.warn{margin-top:10px;font-size:12.5px;color:var(--red);border:1px solid var(--red);border-radius:8px;padding:8px 10px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts .wide{grid-column:1/-1}
.empty{color:var(--mute);text-align:center;padding:40px 10px;font-size:14px}
.legal{color:var(--mute);font-size:11.5px;margin-top:22px;line-height:1.5}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== GRT (Gordon's Reloading Tool) — bibliothèque commune de l'Atelier ===== */
const GRT=(()=>{
 const K="atelier-grt-v1";
 const dec=s=>{try{return decodeURIComponent(String(s??""))}catch(e){return String(s??"")}};
 const num=s=>{const m=String(s??"").replace(",",".").match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):null};
 const unit=s=>String(s??"").trim().split(/\s+/).slice(1).join(" ");
 const toG=s=>{const v=num(s);if(v==null)return null;return /gr/i.test(unit(s))?v/15.4324:v};
 const toMm=s=>{const v=num(s);if(v==null)return null;return /^in/.test(unit(s))?v*25.4:v};
 const toBar=s=>{const v=num(s);if(v==null)return null;const u=unit(s);return /psi/i.test(u)?v*0.0689476:/mpa/i.test(u)?v*10:v};
 const toMs=s=>{const v=num(s);if(v==null)return null;return /ft/i.test(unit(s))?v*0.3048:v};
 const rd=(x,n)=>x==null||isNaN(x)?null:Math.round(x*10**n)/10**n;
 const MARQUES={sellierbellot:"Sellier & Bellot",reloadswiss:"Reload Swiss",vihtavuori:"Vihtavuori",hodgdon:"Hodgdon",alliant:"Alliant",
  norma:"Norma",lapua:"Lapua",sierra:"Sierra",hornady:"Hornady",nosler:"Nosler",berger:"Berger",vectan:"Vectan",accurate:"Accurate",imr:"IMR",winchester:"Winchester",ramshot:"Ramshot"};
 const marque=s=>{const d=dec(s).trim();return MARQUES[d.toLowerCase().replace(/[^a-z]/g,"")]||d};
 const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)};
 const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
 function parse(o,fname){
  if(!o||!o.projectile||!o.propellant||!Array.isArray(o.ladder))throw new Error("Ce fichier n'est pas un export de calcul GRT.");
  const cal=o.caliber||{},spec=o.caliberspec||{},gun=o.gun||{},pr=o.projectile,pw=o.propellant;
  const calibre=dec(spec.cipname||cal.CaliberName).replace(/\s*\(.*$/,"").replace(/\.\s*$/,"").trim();
  const dz=num(cal.Dz),calBal=dz?("."+String(Math.round(dz*1000)).padStart(3,"0")):"";
  const projectile={marque:marque(pr.mname),modele:dec(pr.pname).trim(),gr:rd(num(pr.mp)*(/grain|^gr/i.test(unit(pr.mp))||!unit(pr.mp)?1:15.4324),1),
   diam:rd(toMm(pr.Dbul),2),long:rd(toMm(pr.glen),2),g1:num(pr.g1bc),g7:num(pr.g7bc)};
  projectile.label=[projectile.marque,projectile.modele,calBal,projectile.gr+" gr"].filter(Boolean).join(" ");
  const poudre={marque:marque(pw.mname),modele:dec(pw.pname).trim(),lot:dec(pw.lotid).trim()};
  poudre.label=poudre.marque+" "+poudre.modele;
  const ladder=o.ladder.map(s=>{const g=toG(s.charge),r=s.results||{},m=s.messages||{};
   const w=Array.isArray(m.warnings)?m.warnings.map(x=>dec(x).replace(/\s+/g," ").trim()).join(" "):"";
   return {g:rd(g,3),gr:rd(g*15.4324,1),v:rd(toMs(r.MuzzleVelocity),0),p:rd(toBar(r.PeakPressure),0),e:num(r.MuzzleEnergy),remp:num(r.LoadRatio),warn:w}})
   .filter(x=>x.g).sort((a,b)=>a.g-b.g);
  const src=(dec(fname||o.File||"").split(/[\\/]/).pop()||"export GRT").replace(/\.(json|xml)$/i,"");
  const gunNom=dec(gun.GunName).trim();
  const c={calibre,projectile,poudre,ladder,chargeRef:rd(toG(pw.mc),3),col:rd(toMm(cal.oal),2),longEtui:rd(toMm(cal.caselen),2),
   volume:rd(num(cal.casevol)*(/g\s*h2o/i.test(unit(cal.casevol))?15.4324:1),1),pmax:rd(num(spec.Pmax)&&/bar/i.test(unit(spec.Pmax))?num(spec.Pmax):toBar(cal.pMaxZul),0),
   canon:rd(toMm(gun.xe),0),pas:num(gun.twistlen),arme:/^sans nom$/i.test(gunNom)?"":gunNom,src,importe:new Date().toISOString().slice(0,10)};
  c.nom=`${calibre} · ${projectile.marque} ${projectile.modele} ${projectile.gr} gr · ${poudre.marque} ${poudre.modele}`;
  c.id="grt-"+hash(JSON.stringify([calibre,projectile.label,poudre.label,poudre.lot,c.chargeRef,ladder.map(x=>x.g)]));
  return c;
 }
 const list=()=>{try{const a=JSON.parse(localStorage.getItem(K)||"[]");return Array.isArray(a)?a:[]}catch(e){return []}};
 const store=a=>{try{localStorage.setItem(K,JSON.stringify(a))}catch(e){}};
 function add(cs){const a=list();let n=0;cs.forEach(c=>{const i=a.findIndex(x=>x.id===c.id);if(i<0){a.push(c);n++}else a[i]={...c,importe:a[i].importe}});store(a);return n}
 function pick(){return new Promise(res=>{const i=document.createElement("input");i.type="file";i.accept=".json,application/json";i.multiple=true;
  i.onchange=async()=>{const ok=[],err=[];for(const f of [...(i.files||[])]){try{ok.push(parse(JSON.parse(await f.text()),f.name))}catch(e){err.push(f.name)}}
   const nouveaux=add(ok);res({ok,err,nouveaux})};i.click()})}
 const remove=id=>store(list().filter(c=>c.id!==id));
 const get=id=>list().find(c=>c.id===id);
 const at=(c,g)=>c&&c.ladder.find(x=>Math.abs(x.g-g)<0.0015);
 const match=(label,arr)=>arr.find(x=>x!==label&&norm(x)===norm(label))||arr.find(x=>norm(x)===norm(label))||label;
 const merge=(base,k)=>{const n=new Set(base.map(norm));return [...base,...labels(k).filter(x=>!n.has(norm(x)))]};
 const defaut=c=>{const ref=at(c,c.chargeRef)||c.ladder[c.ladder.length-1];if(!ref||!ref.warn)return ref;return [...c.ladder].reverse().find(x=>!x.warn&&x.g<=ref.g)||c.ladder[0]};
 const labels=k=>[...new Set(list().map(c=>c[k].label))];
 const resume=r=>{let t=r.ok.length?`${r.ok.length} calcul${r.ok.length>1?"s":""} GRT lu${r.ok.length>1?"s":""}, dont ${r.nouveaux} nouveau${r.nouveaux>1?"x":""}.`:"Aucun calcul GRT importé.";
  if(r.err.length)t+=`\nNon reconnu${r.err.length>1?"s":""} : ${r.err.join(", ")}. Dans GRT, utilise l'export JSON du calcul.`;return t};
 return {list,add,pick,get,at,match,labels,merge,defaut,resume,parse,remove};
})();

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fr=(x,n=0)=>x==null||isNaN(x)?"—":Number(x).toLocaleString("fr-FR",{minimumFractionDigits:n,maximumFractionDigits:n});
const ui={sel:{},msg:""};
const toParent=m=>{try{window.parent.postMessage(m,"*")}catch(e){}};
function chargeSel(c){const g=ui.sel[c.id];return c.ladder.find(x=>x.g===g)||GRT.defaut(c)}
function pcls(p,pmax){if(!pmax||p==null)return"";const r=p/pmax;return r>=.92?"hot":r>=.85?"mid":"ok"}
function card(c){
  const s=chargeSel(c);
  return `<section class="card" aria-label="${esc(c.nom)}">
   <h2>${esc(c.nom)}</h2>
   <div class="meta">
     ${c.canon?`<span>canon <b>${fr(c.canon)} mm</b></span>`:""}${c.pas?`<span>pas <b>1:${fr(c.pas,0)}"</b></span>`:""}
     ${c.col?`<span>COL <b>${fr(c.col,2)} mm</b></span>`:""}${c.volume?`<span>étui <b>${fr(c.volume,1)} gr H₂O</b></span>`:""}
     ${c.projectile.g1?`<span>G1 <b>${fr(c.projectile.g1,3)}</b></span>`:""}${c.projectile.g7?`<span>G7 <b>${fr(c.projectile.g7,3)}</b></span>`:""}
     ${c.poudre.lot?`<span>lot poudre <b>${esc(c.poudre.lot)}</b></span>`:""}${c.pmax?`<span>P max CIP <b>${fr(c.pmax)} bar</b></span>`:""}
   </div>
   <div class="tw"><table>
     <thead><tr><th>Charge</th><th>grains</th><th>Vitesse</th><th>Pression</th><th>% Pmax</th></tr></thead>
     <tbody>${c.ladder.map(x=>`<tr tabindex="0" class="${x.g===s.g?"sel":""}" data-g="${x.g}" data-id="${esc(c.id)}">
       <td>${fr(x.g,3)} g${x.warn?" ⚠":""}</td><td>${fr(x.gr,1)}</td><td>${fr(x.v)} m/s</td><td>${fr(x.p)} bar</td>
       <td><span class="pc ${pcls(x.p,c.pmax)}">${c.pmax?fr(x.p/c.pmax*100)+" %":"—"}</span></td></tr>`).join("")}</tbody>
   </table></div>
   ${s.warn?`<div class="warn">GRT, à ${fr(s.g,3)} g : ${esc(s.warn)}</div>`:""}
   <div class="acts">
     <button class="btn p wide" data-a="seance" data-id="${esc(c.id)}">Préparer une séance de recharge à ${fr(s.g,3)} g</button>
     <button class="btn" data-a="fiche" data-id="${esc(c.id)}">Fiche munition</button>
     <button class="btn" data-a="clics" data-id="${esc(c.id)}">Calculer les clics</button>
     <button class="btn s d" data-a="suppr" data-id="${esc(c.id)}" style="justify-self:start">Retirer ce calcul</button>
   </div>
   <div class="help">Touche une ligne de l'échelle pour choisir la charge. Fichier : ${esc(c.src)} · importé le ${esc(c.importe)}</div>
  </section>`;
}
function render(){
  const l=GRT.list();
  document.getElementById("app").innerHTML=`
  <header><div><h1>Calculs GRT</h1><div class="sub">${l.length} calcul${l.length>1?"s":""} importé${l.length>1?"s":""} · Gordon's Reloading Tool</div></div></header>
  <button class="btn p full" data-a="imp">Importer des calculs GRT (.json)</button>
  <div class="help">Dans GRT, exporte le calcul en JSON, puis choisis un ou plusieurs fichiers. Chaque calcul crée sa fiche munition dans l'onglet Tir et devient un point de départ dans Recharge.</div>
  ${ui.msg?`<div class="msg" role="status">${esc(ui.msg)}</div>`:""}
  ${l.length?l.map(card).join(""):`<div class="empty">Aucun calcul importé pour l'instant.</div>`}
  <p class="legal">Les vitesses et pressions sont des prévisions de GRT, pas des mesures. Monte toujours en charge progressivement, en partant d'en bas de l'échelle, et arrête-toi aux premiers signes de surpression.</p>`;
}
document.addEventListener("click",e=>{
  const tr=e.target.closest("tr[data-g]");if(tr){ui.sel[tr.dataset.id]=+tr.dataset.g;render();return}
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,c=id&&GRT.get(id);
  if(a==="imp"){GRT.pick().then(r=>{ui.msg=GRT.resume(r);render();toParent({type:"atelier:grt-maj"})});return}
  if(!c)return;
  const g=chargeSel(c).g;
  if(a==="seance")toParent({type:"atelier:grt",cible:"recharge",grtId:id,g});
  if(a==="fiche")toParent({type:"atelier:grt",cible:"tir",action:"fiche",grtId:id,g});
  if(a==="clics")toParent({type:"atelier:grt",cible:"tir",action:"clics",grtId:id,g});
  if(a==="suppr"){if(b.dataset.ok){GRT.remove(id);ui.msg="Calcul retiré. Sa fiche munition reste dans l'onglet Tir.";render()}
    else{b.dataset.ok=1;b.textContent="Confirmer le retrait"}}
});
document.addEventListener("keydown",e=>{const tr=e.target.closest&&e.target.closest("tr[data-g]");if(tr&&(e.key==="Enter"||e.key===" ")){e.preventDefault();tr.click()}});
window.addEventListener("message",e=>{if(e.data&&e.data.type==="atelier:show"){ui.msg="";render()}});
render();
</script>
</body>
</html>
