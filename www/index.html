<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1417">
<link rel="manifest" href="manifest.json">
<title>Atelier de tir</title>
<style>
:root{--bg:#0E1417;--bar:#141c20;--line:#26323a;--ink:#e6ecef;--mute:#8a99a3;--acc:#f07a3c}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column}
#frames{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bar);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{appearance:none;background:none;border:0;color:var(--mute);padding:9px 4px 10px;display:grid;justify-items:center;gap:3px;
  font:600 12.5px/1 system-ui,sans-serif;letter-spacing:.02em;cursor:pointer}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--acc)}
nav button:focus-visible{outline:2px solid var(--acc);outline-offset:-4px}
</style>
</head>
<body>
<div id="frames"></div>
<nav role="tablist" aria-label="Sections">
  <button role="tab" data-tab="recharge" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v5l-4 9a2 2 0 0 0 2 3h8a2 2 0 0 0 2-3l-4-9V3"/><path d="M7.5 14h9"/></svg>Recharge</button>
  <button role="tab" data-tab="tir" aria-selected="false">
    <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="11" r="4"/><circle cx="12" cy="11" r="1"/><path d="M8 18h8"/></svg>Tir</button>
  <button role="tab" data-tab="clics" aria-selected="false">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/></svg>Clics</button>
  <button role="tab" data-tab="grt" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="M7 15l4-5 3 3 5-7"/><path d="M15 6h4v4"/></svg>GRT</button>
</nav>
<script>
const PAGES={recharge:"recharge.html",tir:"tir.html",clics:"clics.html",grt:"grt.html"};
const frames={},pending={};
let cur=null;
function frame(t){
  if(frames[t])return frames[t];
  const f=document.createElement("iframe");f.src=PAGES[t];f.title=t;f.hidden=true;
  f.addEventListener("load",()=>{f._ok=true;(pending[t]||[]).forEach(m=>f.contentWindow.postMessage(m,"*"));pending[t]=[]});
  document.getElementById("frames").appendChild(f);return frames[t]=f;
}
function send(t,m){const f=frame(t);if(f._ok)f.contentWindow.postMessage(m,"*");else(pending[t]=pending[t]||[]).push(m)}
function show(t){
  if(!PAGES[t])t="tir";
  Object.entries(frames).forEach(([k,f])=>f.hidden=k!==t);
  frame(t).hidden=false;cur=t;
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  try{localStorage.setItem("atelier-onglet",t)}catch(e){}
  send(t,{type:"atelier:show"});
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.tab));
window.addEventListener("message",e=>{const m=e.data||{};
  if(m.type==="atelier:go")show(m.tab);
  if(m.type==="atelier:clics"){show("clics");send("clics",m)}
  if(m.type==="atelier:grt-maj"){["tir","recharge","clics"].forEach(t=>{if(frames[t])send(t,{type:"atelier:grt-maj"})})}
  if(m.type==="atelier:grt"){if(m.cible==="recharge"){show("recharge");send("recharge",m)}
    else if(m.action==="clics"){frame("tir");send("tir",m)}
    else{show("tir");send("tir",m)}}});
let start="tir";try{start=localStorage.getItem("atelier-onglet")||"tir"}catch(e){}
show(start);
</script>
</body>
</html>
